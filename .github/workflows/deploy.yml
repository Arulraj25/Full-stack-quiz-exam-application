name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/quiz-portal-backend:latest

    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/quiz-portal-frontend:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT || 22 }}
        script: |
          # Create project directory
          mkdir -p /home/ubuntu/quiz-portal
          
          # Navigate to project directory
          cd /home/ubuntu/quiz-portal
          
          # Create .env file
          cat > .env << EOF
          NODE_ENV=production
          PORT=5000
          DB_HOST=mysql
          DB_USER=root
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MYSQL_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.DB_NAME }}
          EOF
          
          # Create docker-compose.yml
          cat > docker-compose.yml << 'EOF'
          version: '3.8'
          
          services:
            backend:
              image: ${{ secrets.DOCKER_USERNAME }}/quiz-portal-backend:latest
              container_name: quiz-backend
              restart: always
              env_file:
                - .env
              ports:
                - "5000:5000"
              depends_on:
                - mysql
              networks:
                - quiz-network
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
            
            frontend:
              image: ${{ secrets.DOCKER_USERNAME }}/quiz-portal-frontend:latest
              container_name: quiz-frontend
              restart: always
              ports:
                - "3000:80"
              networks:
                - quiz-network
              depends_on:
                - backend
            
            mysql:
              image: mysql:8.0
              container_name: quiz-mysql
              restart: always
              env_file:
                - .env
              ports:
                - "3306:3306"
              volumes:
                - mysql_data:/var/lib/mysql
                - ./backend/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
              networks:
                - quiz-network
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                timeout: 20s
                retries: 10
          
          networks:
            quiz-network:
              driver: bridge
          
          volumes:
            mysql_data:
          EOF
          
          # Login to Docker Hub
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          # Deploy
          docker-compose pull
          docker-compose down
          docker-compose up -d
          
          # Wait for MySQL to be ready
          echo "Waiting for MySQL to be ready..."
          sleep 30
          
          # Initialize database schema if not already done
          docker-compose exec -T mysql mysql -uroot -p${{ secrets.DB_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ secrets.DB_NAME }};"
          
          # Clean up
          docker image prune -f
          
          # Show status
          docker-compose ps
          docker-compose logs --tail=20