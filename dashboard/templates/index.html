<!DOCTYPE html>
<html>

<head>

<title>
Quiz Analytics Dashboard
</title>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<h1>
Quiz Analytics Dashboard
</h1>



<div class="container">


<div class="card">
<h3>Total Users</h3>
<h2 id="totalUsers">0</h2>
</div>


<div class="card">
<h3>Total Quizzes</h3>
<h2 id="totalQuizzes">0</h2>
</div>


<div class="card">
<h3>Total Questions</h3>
<h2 id="totalQuestions">0</h2>
</div>


<div class="card">
<h3>Attempts</h3>
<h2 id="attempts">0</h2>
</div>


<div class="card">
<h3>Completed</h3>
<h2 id="completed">0</h2>
</div>


<div class="card">
<h3>Abandoned</h3>
<h2 id="abandoned">0</h2>
</div>


<div class="card">
<h3>Average Score</h3>
<h2 id="avgScore">0</h2>
</div>


</div>



<script src="/static/script.js"></script>


</body>

</html>
