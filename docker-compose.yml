services:
  backend:
    build: ./backend
    container_name: quiz-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-quiz_portal}
      - JWT_SECRET=${JWT_SECRET:-secretkey}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: quiz-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - quiz-network

  mysql:
    image: mysql:8.0
    container_name: quiz-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_DATABASE=${DB_NAME:-quiz_portal}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    networks:
      - quiz-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-password}"]
      timeout: 20s
      retries: 10
      interval: 10s

networks:
  quiz-network:
    driver: bridge

volumes:
  mysql_data: