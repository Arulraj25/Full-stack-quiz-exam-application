services:
  mysql:
    image: mysql:8.0
    container_name: quiz_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quiz_portal
      MYSQL_USER: quizuser
      MYSQL_PASSWORD: quizpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - quiz-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: quiz_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: quizuser
      DB_PASSWORD: quizpassword
      DB_NAME: quiz_portal
      JWT_SECRET: your_very_secure_jwt_secret_key_change_this
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: quiz_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - quiz-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  quiz-network:
    driver: bridge
