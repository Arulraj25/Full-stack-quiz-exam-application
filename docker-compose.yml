services:
  mysql:
    image: mysql:8.0
    container_name: quiz_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: quiz_portal
      MYSQL_USER: quizuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    networks:
      - quiz-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      
  backend:
    build: ./backend
    container_name: quiz_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: quizuser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: quiz_portal
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build: ./frontend
    container_name: quiz_frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - quiz-network
    depends_on:
      - backend

  dashboard:
    build: ./dashboard
    container_name: quiz_dashboard
    restart: always
    environment:
      AZURE_SERVER: ${AZURE_SERVER}
      AZURE_DATABASE: ${AZURE_DATABASE}
      AZURE_USERNAME: ${AZURE_USERNAME}
      AZURE_PASSWORD: ${AZURE_PASSWORD}
      PORT: 5002
    ports:
      - "5002:5002"
    networks:
      - quiz-network
    depends_on:
      - backend

networks:
  quiz-network:
    driver: bridge

volumes:
  mysql_data: